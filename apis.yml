aid: eden
name: Eden
description: 'Eden is a Latin American healthcare technology company providing cloud-based medical
  imaging and radiology software for hospitals, clinics, and diagnostic centers. Its platform
  includes Eden PACS (a cloud picture archiving and communication system and DICOM viewer), Eden
  Management (scheduling, referral, and operational workflow tools), Eden Intelligence (data-driven
  analytics for medical institutions), and Eden Creator (an AI assistant for drafting diagnostic
  impressions). Eden is backed by Sierra Ventures and serves medical institutions across Latin
  America. No public developer API, documentation, or well-known discovery surface was found during
  enrichment.'
